name: Codex PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Codex review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted gate code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out candidate merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify review gate decisions
        run: python -m unittest discover -s trusted/.github/scripts -p test_codex_review.py -v

      - name: Prepare review context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python trusted/.github/scripts/prepare_codex_review.py review-prompt.md

      - name: Run read-only Codex review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          prompt-file: review-prompt.md
          output-schema-file: trusted/.github/codex-review-schema.json
          output-file: codex-review-result.json

      - name: Publish verdict and gate merge
        env:
          GITHUB_TOKEN: ${{ secrets.GW2_AUTOMATION_TOKEN }}
          AUTO_MERGE_ENABLED: ${{ vars.GW2_AUTO_MERGE_ENABLED }}
        run: python trusted/.github/scripts/complete_codex_review.py codex-review-result.json
