name: Claude implementation

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open story issue number to implement or continue'
        required: true
        type: string

concurrency:
  group: claude-implementation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  issues: read
  id-token: write
  actions: write

jobs:
  implement:
    if: github.actor == 'Nebettadjsr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Use the Claude subscription; do not fall back to Console/API billing.
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate story and prepare branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Enter an issue number.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/claude-issue.json"
          jq -e '.state == "open" and (has("pull_request") | not)' "$RUNNER_TEMP/claude-issue.json" >/dev/null || {
            echo 'The number must identify an open issue, not a PR.' >&2
            exit 1
          }
          prefix="story/issue-${ISSUE_NUMBER}-run-"
          legacy_prefix="story/${ISSUE_NUMBER}-"
          existing_branch="$(gh pr list --base master --state open --limit 100 --json headRefName |
            jq -r --arg prefix "$prefix" --arg legacy "$legacy_prefix" \
              '[.[] | select(.headRefName | (startswith($prefix) or startswith($legacy)))] |
              if length > 1 then error("Multiple open PRs for this issue") else .[0].headRefName // empty end')"
          if [[ -n "$existing_branch" ]]; then
            git fetch origin "$existing_branch"
            git switch -c "$existing_branch" FETCH_HEAD
            branch_name="$existing_branch"
            echo 'existing_pr=true' >> "$GITHUB_OUTPUT"
          else
            branch_name="${prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch_name"
            echo 'existing_pr=false' >> "$GITHUB_OUTPUT"
          fi
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Implement one story
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_BRANCH: ${{ steps.prepare.outputs.branch_name }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Work on GitHub issue #${{ inputs.issue_number }} in ${{ github.repository }} only.
            Read the full issue, its acceptance criteria, and relevant repository instructions.
            Implement or finish that one issue on the checked-out story branch.
            If this branch already has a PR, address its review and CI feedback as part of this issue.
            Run narrow checks and report the exact results. Do not start another issue.
            Leave committing, pushing, and PR creation to the workflow steps after this action.
          claude_args: |
            --max-turns 12
            --allowedTools Read,Edit,Write,Glob,Grep,Bash

      - name: Publish story branch
        if: steps.claude.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          EXISTING_PR: ${{ steps.prepare.outputs.existing_pr }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH_NAME"
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Implement issue #${{ inputs.issue_number }}"
          fi
          if [[ "$EXISTING_PR" == 'false' ]] && [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/master)" ]]; then
            echo 'Claude made no changes; no PR was opened.' >&2
            exit 1
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"
          # A push made with GITHUB_TOKEN does not trigger CI on an existing PR.
          # workflow_dispatch is the documented exception to that suppression.
          if [[ "$EXISTING_PR" == 'true' ]]; then
            gh workflow run ci.yml --ref "$BRANCH_NAME"
          fi

      - name: Open story PR
        if: steps.claude.outputs.conclusion == 'success' && steps.prepare.outputs.existing_pr == 'false'
        env:
          GH_TOKEN: ${{ secrets.GW2_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          cat > "$RUNNER_TEMP/claude-pr-body.md" <<EOF
          Closes #$ISSUE_NUMBER

          ## Scope

          One manually authorized Claude run for issue #$ISSUE_NUMBER.
          Review the issue and Actions run for acceptance criteria and verification.

          ## Review

          Merge only after green CI and a satisfactory Codex review.
          EOF
          gh pr create --head "$BRANCH_NAME" --base master \
            --title "Implement issue #$ISSUE_NUMBER" \
            --body-file "$RUNNER_TEMP/claude-pr-body.md"
