name: Run next ready story with Claude

on:
  workflow_dispatch:

concurrency:
  group: claude-implementation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  issues: write
  id-token: write
  actions: write
  checks: read

jobs:
  implement:
    if: github.actor == 'Nebettadjsr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gw2ci
          POSTGRES_PASSWORD: gw2ci
          POSTGRES_DB: gw2ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Use the Claude subscription; do not fall back to Console/API billing.
      ANTHROPIC_API_KEY: ''
      CLAUDE_MAX_TURNS: ${{ vars.CLAUDE_MAX_TURNS || '40' }}
      DATABASE_URL: jdbc:postgresql://localhost:5432/gw2ci
      DATABASE_USER: gw2ci
      DATABASE_PASSWORD: gw2ci
      GW2_API_KEY: ci-placeholder-no-live-api-calls
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Prepare test runtime
        run: |
          chmod +x backend/mvnw
          printf 'ICON_CACHE_DIR=%s/gw2-icons\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Validate run allowance
        id: limits
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLAUDE_MAX_TURNS" =~ ^([1-9]|[1-9][0-9]|100)$ ]] || {
            echo 'CLAUDE_MAX_TURNS must be an integer from 1 to 100.' >&2
            exit 1
          }
          echo "max_turns=$CLAUDE_MAX_TURNS" >> "$GITHUB_OUTPUT"
          # Helpers run from trusted copies so the story branch cannot alter them.
          cp .github/scripts/save_claude_recovery.py "$RUNNER_TEMP/save_claude_recovery.py"
          cp .github/scripts/summarize_claude_run.py "$RUNNER_TEMP/summarize_claude_run.py"
          cp .github/scripts/collect_rework_context.py "$RUNNER_TEMP/collect_rework_context.py"
          cp .github/scripts/harness_paths.py "$RUNNER_TEMP/harness_paths.py"
          cp .github/scripts/discard_out_of_scope.py "$RUNNER_TEMP/discard_out_of_scope.py"
          cp .github/scripts/extract_harness_feedback.py "$RUNNER_TEMP/extract_harness_feedback.py"

      - name: Verify workflow helpers
        run: python -m unittest discover -s .github/scripts

      - name: Select next ready story
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/select_claude_story.py

      - name: Validate story and prepare branch
        id: prepare
        if: steps.select.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
          EXISTING_BRANCH: ${{ steps.select.outputs.pr_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Enter an issue number.' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/claude-issue.json"
          jq -e '.state == "open" and (has("pull_request") | not)' "$RUNNER_TEMP/claude-issue.json" >/dev/null || {
            echo 'The number must identify an open issue, not a PR.' >&2
            exit 1
          }
          if [[ -n "$EXISTING_BRANCH" ]]; then
            git check-ref-format --branch "$EXISTING_BRANCH"
            git fetch origin "$EXISTING_BRANCH"
            git switch -c "$EXISTING_BRANCH" FETCH_HEAD
            recovery_base=$(git rev-parse HEAD)
            # Include merged prerequisites and the current workflow before Claude starts.
            # A conflict stops preparation before any model usage is consumed.
            git fetch origin master
            git merge origin/master --no-edit
            branch_name="$EXISTING_BRANCH"
            echo 'existing_pr=true' >> "$GITHUB_OUTPUT"
          else
            branch_name="story/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch_name"
            recovery_base=$(git rev-parse HEAD)
            echo 'existing_pr=false' >> "$GITHUB_OUTPUT"
          fi
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "recovery_base=$recovery_base" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "claude_base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect rework context
        id: rework_context
        if: steps.select.outputs.issue_number != '' && steps.prepare.outputs.existing_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REWORK_BRANCH: ${{ steps.prepare.outputs.branch_name }}
          REWORK_CONTEXT_FILE: ${{ runner.temp }}/gw2-rework-context.md
        run: python "$RUNNER_TEMP/collect_rework_context.py"

      - name: Implement one story
        id: claude
        if: steps.select.outputs.issue_number != ''
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_BRANCH: ${{ steps.prepare.outputs.branch_name }}
          GW2_RUN_REPORT: ${{ runner.temp }}/gw2-claude-report.md
          GW2_REWORK_CONTEXT: ${{ runner.temp }}/gw2-rework-context.md
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Work on GitHub issue #${{ steps.select.outputs.issue_number }} in ${{ github.repository }} only.
            Read the full issue, its acceptance criteria, and relevant repository instructions.
            Work only on the GW2 application (backend, frontend, docker, application scripts and the
            application documentation under docs). The harness is not part of it: never change
            `.github/`, `agent/`, `tasks/`, `.claude/`, `AGENTS.md`, `CLAUDE.md` or any quality-gate
            configuration, and do not read `agent/` or `.github/`. Such changes are discarded and
            reported. If an instruction, rule or tool of the harness is wrong, missing or cost you
            time, do not fix it: describe it in the report under `## Harness feedback`.
            Implement or finish that one issue on the checked-out story branch.
            If this branch already has a PR, this is rework: read the file named by GW2_REWORK_CONTEXT
            first. It lists the failing checks of the current head with their messages and the
            unresolved review threads. Fix every item. If a changed production behavior is asserted
            by existing tests, update those assertions with a stated reason and run the complete test
            classes you found. A rework that changes nothing is a failed attempt: say so in the report.
            Run narrow checks and report the exact results. Do not start another issue.
            Java 25 and disposable PostgreSQL are available with the CI environment variables.
            Run required database checks against isolated test schemas, never the public schema.
            This run allows ${{ steps.limits.outputs.max_turns }} turns. Batch related reads,
            focus on the remaining acceptance gaps, and write the run report before lengthy checks.
            Keep that report updated so an interrupted attempt can be recovered.
            Before finishing, write a concise Markdown implementation report to the file named by
            GW2_RUN_REPORT. Include changes, exact checks run and results (including the
            quality gates named in CLAUDE.md), changed or weakened assertions with reasons,
            local-only checks still needed, and any unresolved gap. The report must contain a
            section headed exactly `## Acceptance criteria evidence` with a Markdown table
            `| Criterion | Test or evidence | Result |`, one row per acceptance criterion of the issue.
            Name the concrete test class/method, Vitest file or browser journey that verifies the
            criterion; if no automated test applies, write `none` and the reason. The report must also
            contain a section headed exactly `## Harness feedback`: what in the instructions, rules or
            tools was wrong, missing or unclear and what you would change, or `none`. Do not put
            secrets in the report or commit the report file.
            For an automatic merge, include standalone lines exactly
            `Local-only checks still needed: none` and `Unresolved gaps: none` only when true.
            Local-only means a check that needs the owner's machine (a real database outside CI, a
            browser smoke that CI does not run, a live GW2 API call). The complete CI suites are not
            local-only checks: never list them there. Say in the report which checks CI will run.
            Leave committing, pushing, and PR creation to the workflow steps after this action.
          claude_args: |
            --max-turns ${{ steps.limits.outputs.max_turns }}
            --allowedTools Read,Edit,Write,Glob,Grep,Bash
            --disallowedTools "Read(./agent/**),Read(./.github/**),Edit(./agent/**),Edit(./.github/**),Edit(./tasks/**),Edit(./.claude/**),Edit(./AGENTS.md),Edit(./CLAUDE.md),Write(./agent/**),Write(./.github/**),Write(./tasks/**),Write(./.claude/**),Write(./AGENTS.md),Write(./CLAUDE.md)"

      - name: Discard out-of-scope changes
        id: scope_guard
        if: steps.claude.outcome == 'success'
        env:
          DISCARD_BASE: ${{ steps.prepare.outputs.claude_base }}
          DISCARD_REPORT: ${{ runner.temp }}/gw2-discarded.md
        run: python "$RUNNER_TEMP/discard_out_of_scope.py"

      - name: Publish story branch
        id: publish_branch
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          EXISTING_PR: ${{ steps.prepare.outputs.existing_pr }}
          CLAUDE_BASE: ${{ steps.prepare.outputs.claude_base }}
          RECOVERY_BASE: ${{ steps.prepare.outputs.recovery_base }}
          ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
          AUTOMATION_TOKEN: ${{ secrets.GW2_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH_NAME"
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Implement issue #${{ steps.select.outputs.issue_number }}"
          fi
          if [[ "$EXISTING_PR" == 'false' ]] && [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/master)" ]]; then
            echo 'Claude made no changes; no PR was opened.' >&2
            exit 1
          fi
          # Preparation merges master into the PR branch (a PR that is merely behind needs exactly that).
          # Only a rework that changed neither the branch nor anything on top of the merge is a failure.
          if [[ "$EXISTING_PR" == 'true' ]] && [[ "$(git rev-parse HEAD)" == "$CLAUDE_BASE" ]] \
              && [[ "$CLAUDE_BASE" == "$RECOVERY_BASE" ]]; then
            echo 'Claude made no changes to the existing PR; needs-rework stays and no report is published.' >&2
            exit 1
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          pushed_as_owner=false
          if [[ "$EXISTING_PR" == 'true' && -n "$AUTOMATION_TOKEN" ]]; then
            # A rework push made by the automation account triggers the normal pull_request CI,
            # without the approval hold a GITHUB_TOKEN push leaves behind.
            header=$(printf 'x-access-token:%s' "$AUTOMATION_TOKEN" | base64 -w0)
            echo "::add-mask::$header"
            if git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
                push --set-upstream origin "$BRANCH_NAME"; then
              pushed_as_owner=true
            else
              echo '::warning::Push with the automation token failed; falling back to the workflow token and an explicit CI dispatch.'
            fi
          fi
          if [[ "$pushed_as_owner" != 'true' ]]; then
            gh auth setup-git
            git push --set-upstream origin "$BRANCH_NAME"
            # A push made with GITHUB_TOKEN does not trigger CI on an existing PR.
            # workflow_dispatch is the documented exception to that suppression.
            if [[ "$EXISTING_PR" == 'true' ]]; then
              gh workflow run ci.yml --ref "$BRANCH_NAME"
            fi
          fi
          if [[ "$EXISTING_PR" == 'true' ]]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-rework
          fi

      - name: Publish PR evidence
        id: publish_pr
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GW2_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          EXISTING_PR: ${{ steps.prepare.outputs.existing_pr }}
          RUN_REPORT: ${{ runner.temp }}/gw2-claude-report.md
          DISCARDED_FILE: ${{ runner.temp }}/gw2-discarded.md
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_STARTED_AT: ${{ steps.prepare.outputs.started_at }}
          CLAUDE_MAX_TURNS: ${{ steps.limits.outputs.max_turns }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          body="$RUNNER_TEMP/claude-pr-body.md"
          {
            printf '<!-- gw2-claude-run-report:v1 head=%s -->\n' "$(git rev-parse HEAD)"
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf '## Implementation report\n\n'
            if [[ -s "$RUN_REPORT" ]]; then
              cat "$RUN_REPORT"
            else
              printf 'Claude did not supply a run report. Reviewers must request acceptance and check evidence.\n'
            fi
            printf '\n## Workflow evidence\n\n'
            printf -- '- Claude run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- CI and Codex review: check this PR before merging.\n'
            if [[ -s "$DISCARDED_FILE" ]]; then
              printf '\n## Out-of-scope changes discarded\n\n'
              cat "$DISCARDED_FILE"
            fi
            printf '\n'
            python "$RUNNER_TEMP/summarize_claude_run.py" || printf '## Run metrics\n\n- not available\n'
          } > "$body"
          if [[ "$EXISTING_PR" == 'true' ]]; then
            gh pr comment "$BRANCH_NAME" --body-file "$body"
          else
            gh pr create --head "$BRANCH_NAME" --base master \
              --title "Implement issue #$ISSUE_NUMBER" \
              --body-file "$body"
          fi


      - name: Record harness feedback
        id: harness_feedback
        # Independent of publication: a run whose only edits were discarded harness changes publishes no
        # PR, and a failed run may still have written a report. Both are exactly the signals to keep.
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          STORY_ISSUE: ${{ steps.select.outputs.issue_number }}
          RUN_REPORT: ${{ runner.temp }}/gw2-claude-report.md
          DISCARDED_FILE: ${{ runner.temp }}/gw2-discarded.md
          OUTPUT_FILE: ${{ runner.temp }}/gw2-harness-feedback.md
        shell: bash
        run: |
          set -euo pipefail
          PR_URL=$(gh pr view "$BRANCH_NAME" --json url --jq .url || true)
          export PR_URL
          export RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$(python "$RUNNER_TEMP/extract_harness_feedback.py")" == 'create' ]]; then
            gh label create harness-feedback --color fbca04 --description 'Proposal about the harness, for the supervisor or owner' 2>/dev/null || true
            gh issue create --title "Harness feedback from story #${STORY_ISSUE}" --label harness-feedback --body-file "$OUTPUT_FILE"
          fi

      - name: Save interrupted implementation
        id: recovery
        if: ${{ failure() && (steps.claude.outcome == 'failure' || steps.publish_branch.outcome == 'failure' || steps.publish_pr.outcome == 'failure') }}
        env:
          ISSUE_NUMBER: ${{ steps.select.outputs.issue_number }}
          GW2_RUN_REPORT: ${{ runner.temp }}/gw2-claude-report.md
          CLAUDE_RECOVERY_BASE: ${{ steps.prepare.outputs.recovery_base }}
          RECOVERY_STAGE: ${{ steps.publish_pr.outcome == 'failure' && 'PR publication' || steps.publish_branch.outcome == 'failure' && 'branch publication' || 'implementation' }}
        run: python "$RUNNER_TEMP/save_claude_recovery.py"

      - name: Upload interrupted implementation
        if: ${{ failure() && steps.recovery.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-recovery-${{ steps.select.outputs.issue_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-recovery
          retention-days: 7
          if-no-files-found: error
