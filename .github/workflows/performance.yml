# Informational application performance report (STORY-PERF-006, docs/PERFORMANCE_MEASUREMENTS.md).
#
# Never a gate: every measuring step is continue-on-error, the job is continue-on-error, and
# the summary script always exits 0. This workflow is not one of the required checks listed in
# .github/scripts/merge_ready_pr.py and must not be added to branch protection. The functional
# CI workflow (ci.yml) neither depends on it nor runs the benchmarks. No schedule by design.
name: Performance

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  performance:
    name: Performance report (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    services:
      # Ephemeral, job-local PostgreSQL; the benchmarks create and drop their own uniquely named schema.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gw2perf
          POSTGRES_PASSWORD: gw2perf
          POSTGRES_DB: gw2perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run application benchmarks
        id: bench
        continue-on-error: true
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/gw2perf
          DATABASE_USER: gw2perf
          DATABASE_PASSWORD: gw2perf
          # Placeholder: no account key or live ArenaNet access is used.
          GW2_API_KEY: perf-placeholder-no-live-api-calls
          ICON_CACHE_DIR: ${{ runner.temp }}/gw2-icons
        run: |
          set -o pipefail
          mkdir -p perf-out
          chmod +x ./mvnw
          ./mvnw -B -ntp test \
            -Dtest='ApplicationResourceBenchmarkIT,ApplicationBenchmarkBoundaryIT' \
            -DfailIfNoSpecifiedTests=false \
            -Dgw2.perf.output-dir="$GITHUB_WORKSPACE/perf-out" 2>&1 | tee perf-out/maven.log

      - name: Fetch previous report for comparison
        id: previous
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          run_id=$(gh run list --workflow performance.yml --branch master --status completed \
            --limit 10 --json databaseId,conclusion,headSha \
            --jq "[.[] | select(.headSha != \"$GITHUB_SHA\")][0].databaseId // empty")
          if [ -z "$run_id" ]; then echo "no earlier completed master performance run"; exit 0; fi
          gh run download "$run_id" --pattern 'application-performance-*' --dir previous || true
          find previous -name application-resources.json | head -n 1 > previous/path.txt

      - name: Publish summary and metadata
        if: always()
        shell: bash
        run: |
          mkdir -p perf-out
          prev=$(cat previous/path.txt 2>/dev/null || true)
          args=(--report perf-out/application-resources.json
                --summary-out perf-out/summary.md --metadata-out perf-out/metadata.json
                --commit "$GITHUB_SHA" --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                --event "$GITHUB_EVENT_NAME"
                --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                --outcome "${{ steps.bench.outcome }}" --setup-log perf-out/maven.log)
          if [ -n "$prev" ]; then args+=(--previous "$prev"); fi
          python3 .github/scripts/performance_summary.py "${args[@]}" || true
          cat perf-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload performance reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: application-performance-${{ github.sha }}-${{ github.run_id }}
          path: perf-out
          if-no-files-found: warn
          retention-days: 30
