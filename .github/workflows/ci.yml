# Authoritative full-regression gate (docs/TEST_STRATEGY.md §36).
#
# Claude runs targeted checks; this workflow runs the complete application
# suites against each pushed commit and pull request.
#
# Every test job runs the repository's own command. The backend also uses an
# isolated PostgreSQL service. Failure annotations keep the checks readable.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep each commit's result available for PR review and coverage comparison.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workflow-checks:
    name: Workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      - name: Test workflow helpers
        run: python -m unittest discover -s .github/scripts

  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # docs/TEST_STRATEGY.md §31.2 requires Layer 2 tests to run against a real
      # PostgreSQL engine in an isolated, disposable database. Each test creates
      # and drops its own uniquely named schema inside this one, exactly as it
      # does locally. These credentials are an ephemeral service container's
      # own, reachable only from this job -- never a secret, and never the
      # developer's database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gw2ci
          POSTGRES_PASSWORD: gw2ci
          POSTGRES_DB: gw2ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # The repository is developed on Windows with core.filemode=false, so the
      # wrapper's executable bit cannot be relied on to survive a checkout on
      # Linux (a run failed here with exit 126 before this step existed). The
      # bit is also set in the index; this keeps the job working either way.
      - name: Make the Maven wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Run backend test suite
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/gw2ci
          DATABASE_USER: gw2ci
          DATABASE_PASSWORD: gw2ci
          # repo.AppConfig reads this at class-initialization time, so the suite
          # needs the key to be *set*. No test in the default Surefire run makes
          # a live Guild Wars 2 API call (docs/TEST_STRATEGY.md §14, §31.4), so a
          # placeholder is correct here. Never put a real key in this file.
          GW2_API_KEY: ci-placeholder-no-live-api-calls
          ICON_CACHE_DIR: ${{ runner.temp }}/gw2-icons
        # The default Surefire run: *Test classes only. *IT classes (Layer 4
        # live GW2 API smoke, real-database perf/equivalence
        # checks) stay excluded by their naming convention, exactly as locally.
        working-directory: backend
        run: ./mvnw -B -ntp test jacoco:report

      - name: Summarize failing tests
        if: failure()
        run: >-
          python .github/scripts/summarize_test_failures.py
          --label "Backend (Maven)"
          --junit backend/target/surefire-reports

      - name: Upload Java coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage
          path: backend/target/site/jacoco
          if-no-files-found: warn

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The repository's own `npm test` (vitest run). Vitest's built-in
      # github-actions reporter publishes one failure annotation per failing
      # test, which is the same compact channel the summarizer provides for
      # the other jobs -- no extra tooling needed here.
      - name: Run frontend unit tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=github-actions

      # `npm run build` type-checks first (vue-tsc --noEmit), so this covers
      # docs/TEST_STRATEGY.md §12.1's type-check and build verification levels.
      - name: Type-check and build
        run: npm run build

      - name: Upload frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

  coverage-kpi:
    name: Coverage KPI report
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download Java coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: java-coverage
          path: coverage-input/java-coverage

      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: coverage-input/frontend-coverage

      - name: Generate combined coverage KPI
        run: >-
          python .github/scripts/publish_coverage_kpi.py
          --java coverage-input/java-coverage/jacoco.xml
          --frontend coverage-input/frontend-coverage/coverage-summary.json
          --revision "${{ github.sha }}"
          --output coverage-kpi

      - name: Publish coverage KPI to workflow summary
        if: always()
        shell: bash
        run: cat coverage-kpi/coverage-kpi.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined KPI and raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-kpi
            coverage-input
          if-no-files-found: warn
