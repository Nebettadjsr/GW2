# Violations that existed when the rules were introduced are recorded in archunit_store.
# New violations always fail. The store may only be extended deliberately: run
#   ./mvnw test -Dtest=ArchitectureTest -Darchunit.freeze.refreeze=true
# and review the store diff in the PR. Fixed violations are removed automatically.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
freeze.store.default.allowStoreUpdate=true
