<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default non-indexable boundary; the Nginx X-Robots-Tag header repeats it. Not an access control. -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      The browser tab icon. The href is written against the build's configured base path, so the
      served URL stays correct if the application is ever hosted below the origin root. The file it
      points at, `public/favicon.ico`, is copied verbatim into the build output: replacing that one
      file is the whole replacement procedure (README.md, "Replacing the browser favicon").
    -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <!-- The open destination replaces this as soon as the application mounts (`useHashRoute`). -->
    <title>GW2 Crafting Tool</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
