# Backend HTTP API runtime configuration (STORY-API-001).
# Values are externalised, not hard-coded: override through the environment or a --spring.* flag.
spring.application.name=gw2-tool-api
server.port=${GW2_API_PORT:8080}
gw2.global-refresh.interval-ms=${GW2_GLOBAL_REFRESH_INTERVAL_MS:21600000}
gw2.global-refresh.initial-delay-ms=${GW2_GLOBAL_REFRESH_INITIAL_DELAY_MS:60000}
gw2.account-data.max-age-ms=${GW2_ACCOUNT_DATA_MAX_AGE_MS:900000}
# Validated account access (STORY-API-010, TARGET_ARCHITECTURE.md 8.1). Enforcement is off until the
# existing account routes and the browser credential gate are integrated by their own stories;
# session proof, renewal and logout are available either way.
gw2.account-access.enforce=${GW2_ACCOUNT_ACCESS_ENFORCE:false}
gw2.account-access.session-capacity=${GW2_ACCOUNT_SESSION_CAPACITY:500}
# Extra deployment origins accepted for state-changing requests; the serving origin is always allowed.
gw2.account-access.allowed-origins=${GW2_ACCOUNT_ACCESS_ALLOWED_ORIGINS:}
